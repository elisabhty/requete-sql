# L’appli Android (Elisa, 24 novembre, 19 h 48 : « Maintenant pousser la version Android chez Android »).
# Fabriquée ici, sur GitHub, parce que les outils d’Android ne s’installent pas dans l’espace de travail de Claude.
# Lancement à la main (Actions › Appli Android › Run workflow, ou `gh workflow run android.yml`). Deux fichiers sortent :
#   - requete-test.apk : à installer directement sur un téléphone Android pour essayer ;
#   - requete.aab : le paquet à envoyer à Google Play (signé avec la clé d’envoi si les secrets du dépôt sont là, sinon non signé).
# Les secrets (Settings › Secrets and variables › Actions), à créer une fois, jamais dans Git :
#   ANDROID_KEYSTORE_BASE64 (le fichier .jks en base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Appli Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nom de version montré dans Google Play (ex. 1.0)
        required: false
        default: "1.0"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Les outils d’Android sont déjà sur la machine de GitHub (ANDROID_HOME) ; Gradle télécharge ce qui manque.
      - name: Outils d’Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: La page de l’appli, copiée dans le projet Android
        run: npm run build:www && npx cap sync android
      - name: La clé d’envoi (si les secrets sont là)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/envoi.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/envoi.jks" >> "$GITHUB_ENV"
          else
            echo "Pas de clé d’envoi : l’AAB sort non signé."
          fi
      - name: Fabrication
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version || '1.0' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../sortie
          # L’APK d’essai : tout dedans, voix comprises (pas de limite de taille pour un fichier installé à la main).
          # Elle seule porte « RequeteEssaiAndroid » dans le user-agent de sa page : le paywall la laisse passer tant que l’achat
          # n’est pas branché (obEssaiAndroid dans index.html). La configuration est remise telle quelle juste après.
          cp app/src/main/assets/capacitor.config.json "$RUNNER_TEMP/capacitor.config.json"
          node -e "const fs=require('fs'),f='app/src/main/assets/capacitor.config.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.appendUserAgent='RequeteEssaiAndroid';c.android=Object.assign({},c.android,{appendUserAgent:'RequeteEssaiAndroid'});fs.writeFileSync(f,JSON.stringify(c,null,2))"
          ./gradlew --no-daemon assembleDebug
          cp "$RUNNER_TEMP/capacitor.config.json" app/src/main/assets/capacitor.config.json
          cp app/build/outputs/apk/debug/app-debug.apk ../sortie/requete-test.apk
          # L’AAB pour Google Play : les voix passent dans leur paquet (android/voix), livré à l’installation.
          mkdir -p voix/src/main/assets/public/assets
          mv app/src/main/assets/public/assets/voix voix/src/main/assets/public/assets/voix
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../sortie/requete.aab
          ls -la ../sortie
          # Pour l’essai sur émulateur (travail « essai » plus bas) : le même paquet en version inspectable.
          sed -i 's/"webContentsDebuggingEnabled": *false/"webContentsDebuggingEnabled": true/' app/src/main/assets/capacitor.config.json
          ./gradlew --no-daemon bundleDebug
          mkdir -p ../essai
          cp app/build/outputs/bundle/debug/app-debug.aab ../essai/requete-essai.aab
      - name: Bundletool (l’outil de Google qui découpe l’AAB comme Google Play)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R google/bundletool --pattern 'bundletool-all-*.jar' -O "$RUNNER_TEMP/bundletool.jar"
          # Une clé jetable, juste pour installer l’essai sur l’émulateur (rien à voir avec la clé d’envoi à Google Play).
          keytool -genkeypair -keystore "$RUNNER_TEMP/essai.jks" -storepass essai1234 -keypass essai1234 -alias essai \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Essai Requete" -noprompt
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle essai/requete-essai.aab --output essai/requete-essai.apks \
            --ks "$RUNNER_TEMP/essai.jks" --ks-pass pass:essai1234 --ks-key-alias essai --key-pass pass:essai1234
          echo "Taille au téléchargement depuis Google Play (octets, sans le paquet des voix) :"
          java -jar "$RUNNER_TEMP/bundletool.jar" get-size total --apks essai/requete-essai.apks || true
      - name: Vérification de la taille pour Google Play (partie principale sous 200 Mo)
        run: |
          unzip -l sortie/requete.aab | awk 'NF>=4 && $4 ~ /\// {split($4,a,"/"); t[a[1]]+=$1} END {for (k in t) printf "%-12s %6.1f Mo\n", k, t[k]/1048576}' | sort
          base=$(unzip -l sortie/requete.aab | awk 'NF>=4 && $4 ~ /^base\// {s+=$1} END {print int(s/1048576)}')
          voix=$(unzip -l sortie/requete.aab | awk 'NF>=4 && $4 ~ /^voix\/assets\/public\/assets\/voix\// {n++} END {print n+0}')
          echo "Partie principale : $base Mo ; voix dans leur paquet : $voix fichiers"
          test "$base" -lt 190 && test "$voix" -gt 2000
      - name: Vérification du passe d’essai (dans l’APK d’essai seulement, jamais dans l’AAB de Google Play)
        run: |
          unzip -p sortie/requete-test.apk assets/capacitor.config.json | grep -q RequeteEssaiAndroid
          if unzip -p sortie/requete.aab base/assets/capacitor.config.json | grep -q RequeteEssaiAndroid; then echo "::error::L’AAB porte le passe d’essai"; exit 1; fi
          echo "APK d’essai : passe présent ; AAB : aucun passe."
      # Deux téléchargements séparés : l’APK seul pour essayer (sur un téléphone ou l’émulateur d’Android Studio), l’AAB pour Google Play.
      - uses: actions/upload-artifact@v4
        with:
          name: requete-test-apk-${{ github.run_number }}
          path: sortie/requete-test.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: requete-aab-${{ github.run_number }}
          path: sortie/requete.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: essai
          path: essai/requete-essai.apks
          retention-days: 3

  # L’essai : l’appli installée comme depuis Google Play sur un téléphone Android simulé, puis vérifiée de l’intérieur
  # (tools/android/essai.sh et essai.mjs). Les captures d’écran sont dans l’artefact « captures-android ».
  essai:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 34 : Android 14 ; 35 : Android 15, où l’appli s’affiche sous la barre d’état (les marges des bords doivent jouer).
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: essai
          path: essai
      - name: Bundletool
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R google/bundletool --pattern 'bundletool-all-*.jar' -O "$RUNNER_TEMP/bundletool.jar"
      - name: Accélération de l’émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ESSAI_BORDS=${{ matrix.api == 35 && '1' || '0' }} bash tools/android/essai.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-android-${{ matrix.api }}
          path: captures/
          retention-days: 30
