name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La mise à jour à distance de l’appli iPhone (maj.js) : maj/version.json et le manifeste de la version publiée
      # (maj/publication.json), refaits à chaque mise en ligne. Une erreur ici arrête tout : le site reste tel qu’il était.
      - name: Mise à jour à distance de l’appli
        run: node scripts/maj-paquet.mjs --ci
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
