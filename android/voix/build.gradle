// Les voix des cours (220 Mo de MP3, assets/voix) : Google Play refuse une partie principale de plus de 200 Mo.
// Elles partent dans ce paquet de ressources, livré avec l’appli à l’installation (install-time) : pour l’appli,
// rien ne change, les fichiers restent au même endroit (public/assets/voix). Le dossier src/main/assets est rempli
// sur GitHub juste avant la fabrication de l’AAB (.github/workflows/android.yml), jamais à la main.
plugins {
    id 'com.android.asset-pack'
}

assetPack {
    packName = "voix"
    dynamicDelivery {
        deliveryType = "install-time"
    }
}
