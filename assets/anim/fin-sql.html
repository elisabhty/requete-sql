<script>
'use strict';

/* ---------- Le déroulé ---------- */
const SCH = {t: 0.5, caps: [], chaps: [{label:'Projet terminé', a: 0.3}], A: {}, B: {}};
function chap(c){ SCH.t = +(SCH.t + 0.4).toFixed(2); SCH.chaps.push({label: c.label, a: SCH.t}); }
function cap(key, html, dur, gap = 0.1){
  /* Une légende reste au moins le temps de la lire (17 caractères par seconde, plus son fondu de 0,5 s). */
  dur = Math.max(dur, Math.ceil((html.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').length / 17 + 0.5) * 20) / 20);
  const a = +(SCH.t + gap).toFixed(2), b = +(a + dur).toFixed(2);
  SCH.caps.push([a, b, html]); SCH.A[key] = a; SCH.B[key] = b; SCH.t = b;
}
const {A, B} = SCH;
/* 1 · Projet terminé : le bravo du dernier chapitre, la mascotte, des confettis */
cap('g4', "Bravo : tu as terminé<br>le dernier chapitre<br>du projet NutriBoost !", 5.0);
/* 2 · Merci pour tout (Elisa, 26 octobre, 23 h 53 : « mets un message de la part de toutes les équipes, qui te remercient pour
   toutes tes actions », puis sa réponse, mot pour mot). La conversation de groupe : la bannière (l’app s’arrête dessus), puis les
   bulles, une à une, chacune le temps d’être lue ; la photo de l’équipe. Ta réponse : un nouveau message ; l’app s’arrête sur
   « Envoyer », le temps de la lire. */
chap({label:'Merci pour tout'});
const MERCI = +(SCH.t + 0.2).toFixed(2), GTAP = +(MERCI + 1.6).toFixed(2);
const GC_STEP = 0.34, GC_FIRST = +(GTAP + 0.7).toFixed(2);
const GCM = [   // [portrait, nom, bulles] ; la photo de l’équipe : '@photo'
  ['cr', 'Camille Roux', ['Avant ton départ, toute l’équipe tenait à te dire merci 💜', 'Bravo pour tout ce projet ! 🎉']],   // Elisa, 27 octobre, 0 h 31
  ['kb', 'Karim Benali', ['Des premières tables aux index, la base n’a jamais été aussi solide.']],
  ['md', 'Moussa Diallo', ['Côté coachs, les ateliers et les inscriptions sont enfin bien rangés !']],
  ['li', 'Lina', ['Et merci pour mes accès : juste ce qu’il fallait 😉']],
  ['cr', 'Camille Roux', ['@photo', 'Grâce à ton travail, tu as facilité le quotidien de toute l’équipe NutriBoost.',
    'Tu peux être fier du chemin parcouru ! 💜']]];   // Elisa, 27 octobre, 0 h 34 : une phrase par bulle (7 h 08 : sans « Ta mission touche à sa fin. »)
const GC_N = GCM.reduce((n, g) => n + g[2].length, 0);
SCH.t = +(GC_FIRST + (GC_N - 1) * GC_STEP + 0.9).toFixed(2);
cap('h1', "Toutes les équipes de NutriBoost<br>te remercient.", 3.6);
cap('h2', "À ton tour de leur répondre.", 3.0);
const REPLY = +(SCH.t + 0.3).toFixed(2);
const RPP = ['Bonjour à toute l’équipe,',
  'Un grand merci pour vos messages ! Ma mission chez NutriBoost touche à sa fin, et je tenais à vous exprimer toute ma gratitude pour votre accueil chaleureux, votre confiance et votre bienveillance tout au long de cette expérience.',
  'Au fil de vos demandes et des défis rencontrés, j’ai eu l’occasion d’apprendre à utiliser SQL pour résoudre des problèmes concrets. Quel chemin parcouru depuis ma toute première requête ! Vos conseils, vos retours et nos échanges m’ont beaucoup aidé à progresser.',
  'Je repars avec de nouvelles compétences, de beaux souvenirs et la satisfaction d’avoir pu contribuer à vos projets. Merci de m’avoir tant appris et de m’avoir permis de vivre cette expérience enrichissante à vos côtés.',
  'Je vous souhaite à toutes et à tous une excellente continuation, pleine de réussite dans vos projets. J’espère que nos chemins se recroiseront bientôt, peut-être à l’occasion d’une nouvelle mission !',
  'À bientôt 👋'];   // la réponse d’Elisa, mot pour mot
const SEND = +(REPLY + 0.9 + RPP.length * 0.42 + 1.3).toFixed(2);
SCH.t = +(SEND + 1.9).toFixed(2);
cap('h3', "Ton message est envoyé<br>à toute l’équipe NutriBoost.", 3.6);
/* 3 · Le chemin parcouru : la fin de l’apprentissage du SQL (Elisa, 26 octobre, 23 h 53 : « fais une animation waouh pour cette fin »). */
chap({label:'Le chemin parcouru'});
const FIN0 = +(SCH.t + 0.2).toFixed(2);
cap('k1', "Souviens-toi<br>de ta toute première requête.", 3.8, 0.6);
cap('k2', "Regarde le chemin parcouru<br>depuis !", 7.4);
cap('k3', "15 modules, 65 cours<br>et 184 requêtes SQL.", 4.8);   // le nombre de requêtes des cours (Elisa, 27 octobre, 7 h 30)
cap('k4', "Bravo : tu as terminé<br>ton apprentissage du SQL !", 5.6);
/* Et maintenant, la pratique (Elisa, 27 octobre, 1 h 13 : « emmener voir la partie pratique ») : la vidéo le dit, et le bilan
   de la leçon s’ouvre sur « Place à la pratique », qui mène à l’onglet Pratiquer. */
cap('k5', "Et maintenant, place à la pratique :<br>des défis t’attendent !", 4.6);
const DURATION = +(SCH.t + 1.4).toFixed(2);
const CAPTIONS = SCH.caps;
const CHAPTERS = SCH.chaps.map((c, i) => ({n: i + 1, label: c.label, a: c.a, b: i + 1 < SCH.chaps.length ? SCH.chaps[i + 1].a : DURATION}));
const QUESTIONS = [];

/* Le chemin parcouru : les quinze modules et leur mot-clé, du premier au dernier ; ta toute première requête au départ.
   Le monde est plus haut que la carte : la caméra le remonte pendant que le chemin s’allume, puis le montre en entier. */
const FMOD = ['SELECT', 'WHERE', 'CASE', 'GROUP BY', 'JOIN', 'WITH', 'OVER()', 'UML', 'CREATE TABLE', 'INSERT', 'ON DELETE', 'COMMIT', 'TRIGGER', 'INDEX', 'GRANT'];
const FCOL = ['#7C5CFF', '#2F80ED', '#0E9F9A', '#E8892B', '#D9468F', '#169447', '#A23CC9', '#0891B2'];
const FH = 2875, FPTS = [[476, FH - 170]].concat(FMOD.map((m, j) => [j % 2 ? 700 : 250, FH - 170 - (j + 1) * 165]));
const fseg = j => { const [x0, y0] = FPTS[j], [x1, y1] = FPTS[j + 1], a = j ? y0 : y0 - 46;
  return `M${x0} ${a} C${x0} ${a - 90} ${x1} ${y1 + 90} ${x1} ${y1}`; };
/* 184 requêtes : toutes les requêtes différentes des cours (Elisa, 27 octobre, 7 h 30 : « mets le nombre de requêtes des cours ») :
   celles que montrent les vidéos (cartes de code, une requête par « ; », sans les commentaires), comptées une seule fois.
   Depuis le 28 octobre, les cours n’ont plus d’exercice : leurs 44 requêtes ne comptent plus. Le 30 octobre, le cours MERGE en ajoute trois :
   la synchronisation, la requête du collègue aux actions inversées, et son équivalent SQLite (INSERT … ON CONFLICT). Le cours Procédures et
   fonctions stockées en ajoute sept : l’UPDATE de la commande 13, les deux CALL, les deux SELECT calculer_points, CREATE PROCEDURE et CREATE FUNCTION. Le cours Les schémas en
   ajoute huit : les deux CREATE SCHEMA, ALTER TABLE … SET SCHEMA, les quatre SELECT à adresse complète et SELECT * FROM main.clients. */
const FSTAT = [[15, 'modules'], [65, 'cours'], [184, 'requêtes']];
const FDEFIS = 25;   // les défis de l’onglet Pratiquer (CHALLENGES dans l’app)
/* Un compteur qui monte vite puis ralentit : ses valeurs, de 0 au total (une valeur empilée par étape, comme les autres compteurs) */
const FSTEPS = 14, fcount = n => [...new Set(Array.from({length: FSTEPS + 1}, (_, i) => Math.round(n * (1 - Math.pow(1 - i / FSTEPS, 2.2)))))];
const FBURST = [[190, 300, '#FFD45C'], [770, 250, '#FF8FC7'], [150, 760, '#7CE0FF'], [800, 700, '#B9FF8A'], [476, 140, '#C9BEFF']];
/* Les étoiles : des places fixes (la même nuit à chaque lecture) */
const STARS = Array.from({length: 46}, (_, i) => [Math.round((i * 211 + 37) % 930 + 8), Math.round((i * 389 + 91) % 1230 + 8), i % 7 === 0]);

/* Les arrêts « toucher » : le message de l’équipe, puis « Envoyer » */
const BTN = (lip) => ({hand: {x: 0.86, y: 0.78}, press: {y: 7, boxShadow: `0 2px 0 ${lip}`}, rest: {y: 0, boxShadow: `0 9px 0 ${lip}`}});
const button = (id, cls, emo, label) => `<i class="abs bring ${cls}" id="${id}-r"></i><div class="abs run bt ${cls}" id="${id}"><span class="emo">${emo}</span>${label}<i class="ripple"></i></div>`;
const bottom = s => { const el = $(s); return el.offsetTop + el.offsetHeight; };
const pos = el => {
  let x = 0, y = 0, e = el;
  while (e && !e.classList.contains('scene')) {
    x += e.offsetLeft; y += e.offsetTop;
    const p = e.offsetParent;
    if (p && !p.classList.contains('scene')) { x += p.clientLeft; y += p.clientTop; }
    e = p;
  }
  return {x, y, w: el.offsetWidth, h: el.offsetHeight};
};
const bump = (el, t, s = 1.04) => tl.to(el, {scale: s, duration: 0.18, yoyo: true, repeat: 1, ease: 'power1.inOut'}, t);
const capOff = t => tl.to('#cap', {autoAlpha: 0, y: 30, duration: 0.3, ease: 'power2.in'}, t);
const capOn = t => tl.to('#cap', {autoAlpha: 1, y: 0, duration: 0.35, ease: 'power3.out'}, t);
function fingerTap(M, T, f = '#tapf', fx = 0.6, fy = 92){
  const p = pos(M);
  tl.set(f, {left: p.x + p.w * fx, top: p.y + fy}, T - 0.8);
  tl.fromTo(f, {autoAlpha: 0, x: 90, y: 170}, {autoAlpha: 1, x: 0, y: 0, duration: 0.5, ease: 'power3.out', immediateRender: false}, T - 0.75);
  tl.to(f, {scale: 0.86, duration: 0.1, ease: 'power2.in'}, T - 0.15);
  tl.to(f, {scale: 1, duration: 0.15}, T);
  tl.to(f, {autoAlpha: 0, y: 70, duration: 0.3}, T + 0.2);
}
function tapButton(id, T, lip){
  const b = '#' + id;
  if (APP) {
    const rp = $(b + ' .ripple');
    tl.to(rp, {scale: 0, opacity: 0.55, duration: 0.001}, T + 0.001).to(rp, {scale: 1, opacity: 0, duration: 0.7, ease: 'power2.out'}, T + 0.011);
    cue(T + 0.001, 'click');
  } else { fingerTap($(b), T, '#tapw', 0.6, 62); press($(b), T, lip, 9); }
  tl.to(b, {scale: 1.04, duration: 0.14, ease: 'power2.out'}, T + 0.1).to(b, {scale: 1, duration: 0.32, ease: 'back.out(2)'}, T + 0.24);
  tl.to(b + ' .emo', {rotation: -16, transformOrigin: '50% 85%', duration: 0.07, yoyo: true, repeat: 3, ease: 'sine.inOut'}, T + 0.06);
  tl.set(b + '-r', {autoAlpha: 0.9, scale: 1}, T + 0.05);
  tl.to(b + '-r', {autoAlpha: 0, scale: 1.16, duration: 0.6, ease: 'power2.out'}, T + 0.051);
}
const flip = (sel, k, t) => { tl.set(`${sel} .a${k - 1}`, {autoAlpha: 0}, t); tl.set(`${sel} .a${k}`, {autoAlpha: 1}, t); };
const OPENS = [
  {at: GTAP, sel: '#gnb', prompt: 'Touche le message pour l’ouvrir.', label: 'Ouvrir le message de l’équipe NutriBoost'},
  Object.assign({at: SEND, sel: '#bsend', prompt: 'Touche le bouton.', label: 'Envoyer'}, BTN('#4B30CC'))
];

/* ---------- La page ---------- */
const GC = {};
function dom(){
  $('#sn').innerHTML = '<div class="abs fin" id="fin" style="top:500px"><span><span class="emo">🏁</span>Projet NutriBoost terminé !</span></div>' +
    '<img class="abs mascot" id="fmas" src="mascotte.webp" alt="" style="left:350px;top:680px;width:380px">';
  /* Merci pour tout : la bannière, la conversation de toutes les équipes ; puis ta réponse, son bouton « Envoyer », l’avion, « Envoyé » */
  const gpa = k => `<i class="gpa ga-${k}">${k === 'li' ? '' : {cr: 'CR', kb: 'KB', md: 'MD'}[k]}</i>`;
  let g = `<div class="abs gnb" id="gnb"><div class="card sms-n"><i class="sms-ic">${SMS_ICO.bubble}</i><div class="sms-nt"><div class="sms-nr"><b>Équipe NutriBoost</b><span>maintenant</span></div>` +
    `<div class="sms-np">${fr('Camille : Avant ton départ, toute l’équipe tenait à te dire merci 💜')}</div></div></div></div>`;
  let items = '';
  GCM.forEach(([k, who, msgs], r) => {
    items += `<p class="gn" id="gn${r}">${who}</p>`;
    msgs.forEach((m, j) => {
      const last = j === msgs.length - 1, id = `gm${r}-${j}`;
      items += m === '@photo'
        ? `<p class="sms-m sms-ph" id="${id}"><img src="projet-droits-equipe.webp" alt="L’équipe NutriBoost autour d’un gâteau, Camille au centre tient une carte « Merci pour tout ! »"></p>`
        : `<p class="sms-m${last ? ' last' : ''}" id="${id}">${fr(m)}</p>`;
    });
  });
  const avas = GCM.map(([k], r) => gpa(k).replace('<i class="gpa', `<i id="gpa${r}" class="gpa`)).join('');
  g += `<div class="abs gc" id="gc"><div class="gcv"><div class="gch">${SMS_ICO.back}<div class="gav">${['cr', 'kb', 'md', 'li'].map(gpa).join('').replace(/gpa /g, '')}</div>` +
    `<div class="gwho">Équipe NutriBoost<i>›</i></div></div><div class="gcl"><div class="gcs" id="gcs">${items}${avas}</div></div></div></div>`;
  const send = '<svg viewBox="0 0 26 26"><path d="M13 21V6M6.5 12 13 5.5l6.5 6.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  g += `<div class="abs card rp" id="rp"><div class="rph"><span class="rpx">Annuler</span>Merci pour tout !<i class="rpg">${send}</i></div>` +
    '<div class="rpf">À :<span class="rpto"><span class="emo">👥</span>Toute l’équipe NutriBoost</span></div>' +
    '<div class="rpf">Objet :<b>Merci pour tout !</b></div>' +
    `<div class="rpb">${RPP.map((t, k) => `<p id="rpp${k}">${fr(t)}</p>`).join('')}</div></div>`;
  g += button('bsend', '', '✈️', 'Envoyer');
  g += '<div class="abs emo plane" id="plane">✈️</div>';
  g += '<div class="abs rpok" id="rpok" style="top:700px"><span><span class="emo">✅</span>Envoyé à toute l’équipe</span></div>';
  $('#sg').innerHTML = g;

  /* Le chemin parcouru : la carte de nuit, ses étoiles ; le monde (le chemin, ses nœuds, ta première requête) ; le titre, les compteurs,
     le feu d’artifice et la mascotte */
  let f = '<div class="abs fpn" id="fpn"><div class="fst">' + STARS.map(([x, y, b]) => `<i${b ? ' class="b"' : ''} style="left:${x}px;top:${y}px"></i>`).join('') + '</div>';
  f += `<div class="fw" id="fw" style="height:${FH}px"><svg class="fpath" width="952" height="${FH}" viewBox="0 0 952 ${FH}">` +
    FPTS.slice(1).map((q, j) => `<path class="dim" d="${fseg(j)}"/>`).join('') +
    FPTS.slice(1).map((q, j) => `<path class="lit" id="zl${j + 1}" d="${fseg(j)}"/>`).join('') + '</svg>';
  f += FPTS.slice(1).map(([x, y], j) => `<div class="fnd ${x < 476 ? 'nr' : 'nl'}" id="zn${j + 1}" style="left:${x}px;top:${y}px"><i class="fglow"></i>` +
    `<i class="fdot" id="zd${j + 1}">${j + 1}</i><span class="flb">${FMOD[j]}</span></div>`).join('');
  f += `<div class="fqt" id="fqt">Ta toute première requête</div><div class="fq" id="fq"><span class="k">SELECT</span> * <span class="k">FROM</span> clients;</div></div>`;
  f += '<div class="abs ftt" id="ftt"><span class="tg"><span class="emo">🎓</span>Apprentissage terminé</span><b>' +
    [...'Tu parles SQL !'].map(c => c === ' ' ? ' ' : `<span>${c}</span>`).join('') + '</b></div>';
  f += '<div class="abs fsx" id="fsx">' + FSTAT.map(([n, l], k) => `<div><b class="sw" id="zs${k}">${fcount(n).map((v, j) => `<i class="a${j}">${v}</i>`).join('')}</b><span>${l}</span></div>`).join('') + '</div>';
  f += FBURST.map(([x, y, c], k) => `<div class="fbu" id="zb${k}" style="left:${x}px;top:${y}px"><b></b>` +
    Array.from({length: 26}, (_, i) => `<i style="background:${i % 3 ? c : '#fff'};box-shadow:0 0 14px ${c}"></i>`).join('') + '</div>').join('');
  f += `<div class="abs fpr" id="fpr"><span><span class="emo">⚑</span>${FDEFIS} défis t’attendent dans Pratiquer</span></div>`;
  f += '<img class="abs mascot fma" id="fma" src="mascotte.webp" alt=""><i class="fflash" id="fflash"></i></div>';
  $('#sf').innerHTML = f;
  splitChars($('#fq'));

  $('#sg').insertAdjacentHTML('beforeend', '<div class="abs emo tapf" id="tapf">👆</div><div class="abs emo tapf" id="tapw">👆</div>');
}
function layout(){
  // Merci pour tout : chaque portrait à côté de la dernière bulle de son nom ; la conversation remonte quand une bulle ne tient plus
  GCM.forEach((g, r) => { const b = $(`#gm${r}-${g[2].length - 1}`); $('#gpa' + r).style.top = (b.offsetTop + b.offsetHeight - 70) + 'px'; });
  const vis = $('#gcs').parentElement.clientHeight;
  GC.y = $$('#gcs .sms-m').map(b => Math.min(0, Math.round(vis - (b.offsetTop + b.offsetHeight + 36))));
  $('#bsend').style.top = (bottom('#rp') + 42) + 'px'; $('#bsend-r').style.top = (bottom('#rp') + 42) + 'px';
  // le chemin parcouru : ta première requête, centrée au départ ; la longueur de chaque morceau du chemin
  const fq = $('#fq'), [qx, qy] = FPTS[0];
  fq.style.left = (qx - fq.offsetWidth / 2) + 'px'; fq.style.top = (qy - 46) + 'px';
  const fqt = $('#fqt'); fqt.style.left = (qx - fqt.offsetWidth / 2) + 'px'; fqt.style.top = (qy - 100) + 'px';
  $$('.fpath .lit').forEach(e => { const L = Math.ceil(e.getTotalLength()); e.style.strokeDasharray = L; e.style.strokeDashoffset = L; e.dataset.len = L; });
}

function build(){
  layout();
  gsap.set(['#fin', '#fmas', '#tapf', '#tapw', '.bt', '#gnb', '#gc', '#rp', '#bsend', '#plane', '#rpok', '#fpn', '#ftt', '#fsx', '#fma', '#fpr', '.flb', '.fglow', '#fqt'], {autoAlpha: 0});

  /* ===== 1 · Projet terminé ===== */
  sceneOn('#sn', 0.2);
  // bravo : le dernier chapitre du projet est terminé
  const G4 = A.g4;
  show('#fin', G4 + 0.3, {y: 40, scale: 0.85}, 0.6, 'back.out(1.8)'); cue(G4 + 0.3, 'chord', 0.6);
  confetti($('#fin'), G4 + 0.5);
  tl.to('#fin .emo', {rotation: -16, duration: 0.18, yoyo: true, repeat: 3, ease: 'sine.inOut'}, G4 + 1.0);
  // la mascotte arrive, et saute de joie
  show('#fmas', G4 + 0.7, {y: 300, rotation: -6}, 0.9, 'back.out(1.3)'); cue(G4 + 0.7, 'whoosh', 0.6, 1);
  tl.to('#fmas', {y: -26, duration: 0.22, yoyo: true, repeat: 3, ease: 'power2.out'}, G4 + 1.8); cue(G4 + 1.8, 'pop', 0.6, 3); cue(G4 + 2.24, 'pop', 0.6, 5);
  hide(['#fin', '#fmas'], B.g4 - 0.1, {y: -30}, 0.4);
  sceneOff('#sn', MERCI);

  /* ===== 9 · Merci pour tout ===== */
  // la conversation de toutes les équipes : la bannière tombe ; l’élève la touche (l’app s’arrête, OPENS) ; la conversation s’ouvre
  capOff(MERCI - 0.25);
  sceneOn('#sg', MERCI);
  show('#gnb', MERCI + 0.1, {y: -36, scale: 0.94}, 0.55, 'back.out(1.7)'); cue(MERCI + 0.1, 'sms', 0.8);
  if (!APP) fingerTap($('#gnb'), GTAP);
  tl.to('#gnb', {scale: 0.975, duration: 0.09, ease: 'power2.out'}, GTAP).to('#gnb', {scale: 1, duration: 0.3, ease: 'back.out(2.5)'}, GTAP + 0.09);
  cue(GTAP, 'click', 0.5);
  tl.to('#gnb', {autoAlpha: 0, duration: 0.16, ease: 'power2.in'}, GTAP + 0.12);
  gsap.set('#gc', {transformOrigin: '50% 0'});
  tl.fromTo('#gc', {autoAlpha: 0, scaleX: 0.92, scaleY: 0.2}, {autoAlpha: 1, scaleX: 1, scaleY: 1, duration: 0.5, ease: 'power3.out', immediateRender: false}, GTAP + 0.12);
  cue(GTAP + 0.12, 'whoosh', 0.35);
  // les bulles, une à une : le nom au-dessus de la première de chacun, son portrait à côté de sa dernière ; chacune le temps d’être lue
  const gms = $$('#gcs .sms-m');
  gsap.set(gms, {autoAlpha: 0, scale: 0.6, y: 14, transformOrigin: '0% 100%'});
  gsap.set(['#gcs .gn', '#gcs .gpa'], {autoAlpha: 0});
  let k = 0;
  GCM.forEach(([, , msgs], r) => msgs.forEach((m, j) => {
    const at = +(GC_FIRST + k * GC_STEP).toFixed(2);
    if (j === 0) tl.to('#gn' + r, {autoAlpha: 1, duration: 0.2}, at - 0.05);
    tl.to(gms[k], {autoAlpha: 1, scale: 1, y: 0, duration: 0.31, ease: 'back.out(1.8)'}, at);
    if (j === msgs.length - 1) tl.fromTo('#gpa' + r, {autoAlpha: 0, scale: 0.5}, {autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)', immediateRender: false}, at + 0.05);
    if (k && GC.y[k] !== GC.y[k - 1]) tl.to('#gcs', {y: GC.y[k], duration: 0.32, ease: 'power2.out'}, at - 0.02);
    cue(at, m === '@photo' ? 'pop' : 'tick', 0.45, (k % 6) + 2);
    hold(at + 0.32, m === '@photo' ? 2.4 : Math.ceil(readTime(fr(m)) * 20) / 20);
    k++;
  }));
  // les équipes te remercient ; à ton tour de leur répondre
  capOn(A.h1 - 0.3);
  bump('#gc', A.h1 + 0.6, 1.012);
  // ta réponse : la conversation laisse la place à un nouveau message ; ses paragraphes arrivent ; l’app s’arrête sur « Envoyer »
  capOff(REPLY - 0.2);
  hide('#gc', REPLY - 0.1, {y: -30}, 0.35);
  show('#rp', REPLY + 0.3, {y: 40}, 0.55); cue(REPLY + 0.3, 'whoosh', 0.5, 1);
  RPP.forEach((t, i) => { const at = +(REPLY + 0.9 + i * 0.42).toFixed(2); show('#rpp' + i, at, {y: 12}, 0.4, 'power2.out'); cue(at, 'type', 0.7, i % 5); });
  show('#bsend', SEND - 1.0, {y: 30, scale: 0.94}, 0.5, 'back.out(1.7)'); cue(SEND - 1.0, 'pop', 0.7, 2);
  if (!APP) hold(SEND - 0.2, Math.ceil(readTime(RPP.join(' ')) * 0.5));   // hors de l’app, le temps de survoler sa réponse
  tapButton('bsend', SEND, '#4B30CC');
  confetti($('#bsend'), SEND + 0.3);
  // le message part : la carte s’envole, l’avion traverse l’écran, « Envoyé à toute l’équipe »
  hide('#bsend', SEND + 0.55, {y: -20, scale: 0.96}, 0.3);
  tl.to('#rp', {y: -340, scale: 0.55, rotation: -6, autoAlpha: 0, duration: 0.65, ease: 'power3.in'}, SEND + 0.45);
  const bs = pos($('#bsend'));
  tl.fromTo('#plane', {autoAlpha: 1, x: bs.x + 120, y: bs.y, rotation: 0, scale: 0.8}, {x: 1120, y: -160, rotation: -18, scale: 1.3, duration: 1.1, ease: 'power2.in', immediateRender: false}, SEND + 0.55);
  cue(SEND + 0.55, 'whoosh', 0.7);
  show('#rpok', SEND + 1.15, {y: 24, scale: 0.9}, 0.5, 'back.out(1.8)'); cue(SEND + 1.15, 'chord', 0.6);
  capOn(A.h3 - 0.3);
  hide('#rpok', B.h3 - 0.1, {y: -24}, 0.35);
  sceneOff('#sg', FIN0);

  /* ===== 11 · Le chemin parcouru ===== */
  // une carte de nuit : les étoiles s’allument ; ta toute première requête s’écrit au départ du chemin
  sceneOn('#sf', FIN0);
  show('#fpn', FIN0 + 0.05, {y: 60, scale: 0.94}, 0.7, 'expo.out'); cue(FIN0 + 0.05, 'whoosh', 0.7, 1);
  gsap.set('#fw', {y: 1250 - FH});
  const stars = $$('#fpn .fst i');
  gsap.set(stars, {opacity: 0});
  stars.forEach((st, i) => { const t = FIN0 + 0.3 + (i % 12) * 0.12; tl.to(st, {opacity: 0.35 + (i % 4) * 0.18, duration: 0.5}, t);
    tl.to(st, {opacity: 1, scale: 1.6, duration: 0.45, yoyo: true, repeat: 3, ease: 'sine.inOut'}, A.k2 + (i % 9) * 0.7); });
  show('#fqt', A.k1 + 0.3, {y: 14}, 0.4);
  gsap.set('#fq', {autoAlpha: 0, scale: 0.9});
  tl.to('#fq', {autoAlpha: 1, scale: 1, duration: 0.4, ease: 'back.out(1.8)'}, A.k1 + 0.4);
  typeChars($$('#fq .ch'), A.k1 + 0.8, 16);
  tl.to('#fq', {boxShadow: 'inset 0 0 0 3px rgba(201,190,255,.9),0 0 70px rgba(170,150,255,.8)', duration: 0.4, yoyo: true, repeat: 1}, A.k1 + 2.4);
  // le chemin parcouru depuis : chaque module s’allume à son tour, la caméra suit
  const L0 = +(A.k2 + 0.5).toFixed(2), STEP = 0.4;
  tl.to('#fw', {y: 0, duration: 4.3, ease: 'sine.inOut'}, L0 + 0.15);
  FMOD.forEach((m, j) => {
    const n = j + 1, t = +(L0 + j * STEP).toFixed(2), seg = $('#zl' + n);
    tl.to(seg, {strokeDashoffset: 0, duration: 0.3, ease: 'none'}, t - 0.3);
    tl.to('#zd' + n, {backgroundColor: FCOL[j % FCOL.length], boxShadow: `0 0 0 6px rgba(255,255,255,.18), 0 0 34px ${FCOL[j % FCOL.length]}`, color: '#fff', duration: 0.2}, t);
    tl.fromTo('#zd' + n, {scale: 0.7}, {scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false}, t);
    tl.fromTo(`#zn${n} .fglow`, {autoAlpha: 0, scale: 0.4}, {autoAlpha: 1, scale: 1.3, duration: 0.25, immediateRender: false}, t);
    tl.to(`#zn${n} .fglow`, {autoAlpha: 0.35, scale: 1, duration: 0.5}, t + 0.25);
    tl.fromTo(`#zn${n} .flb`, {autoAlpha: 0, x: m && j % 2 ? 24 : -24}, {autoAlpha: 1, x: 0, duration: 0.35, ease: 'power3.out', immediateRender: false}, t + 0.08);
    cue(t, 'tick', 0.55, (j % 7) + 1);
  });
  cue(L0 + FMOD.length * STEP, 'chord', 0.6);
  // vu de loin : tout le chemin, comme une constellation ; puis les compteurs
  const Z = +(A.k3 + 0.1).toFixed(2), FS = +((1250 - 120) / FH).toFixed(4);
  tl.to('#fw', {scale: FS, x: Math.round((952 - 952 * FS) / 2), y: 60, duration: 1.3, ease: 'power3.inOut'}, Z);
  tl.to(['.flb', '#fqt'], {autoAlpha: 0, duration: 0.4}, Z + 0.2);
  tl.to('.fglow', {autoAlpha: 1, scale: 2.2, duration: 0.8}, Z + 0.6);
  cue(Z, 'whoosh', 0.6, 2);
  tl.to('#fw', {opacity: 0.35, duration: 0.5}, Z + 1.6);
  show('#fsx', Z + 1.7, {y: 40, scale: 0.94}, 0.55, 'back.out(1.6)');
  FSTAT.forEach(([n], i) => { const t = Z + 1.9 + i * 0.35, vals = fcount(n);
    gsap.set(`#zs${i} > i:not(.a0)`, {autoAlpha: 0});
    vals.forEach((v, j) => { if (j) flip('#zs' + i, j, +(t + j * 0.075).toFixed(3)); });
    cue(t + vals.length * 0.075, 'pop', 0.55, i + 3); });
  // tu parles SQL : le titre, lettre après lettre ; le feu d’artifice ; les confettis ; la mascotte saute de joie
  const W = +(A.k4 + 0.1).toFixed(2);
  tl.to('#fsx', {y: 0, duration: 0.01}, W);
  show('#ftt .tg', W, {y: 20, scale: 0.8}, 0.4, 'back.out(2)');
  tl.set('#ftt', {autoAlpha: 1}, W);
  tl.fromTo('#ftt b span', {autoAlpha: 0, y: 60, scale: 0.4, rotation: -12}, {autoAlpha: 1, y: 0, scale: 1, rotation: 0, duration: 0.5, stagger: 0.05, ease: 'back.out(2.6)', immediateRender: false}, W + 0.2);
  cue(W + 0.2, 'chord', 0.8);
  tl.fromTo('#fflash', {autoAlpha: 0.75}, {autoAlpha: 0, duration: 0.7, ease: 'power2.out', immediateRender: false}, W + 0.2);   // un éclair de lumière quand le titre arrive
  FBURST.forEach((b, i) => {
    const t = +(W + 0.5 + i * 0.42).toFixed(2), root = '#zb' + i, sparks = $$(root + ' i');
    tl.fromTo(root + ' b', {opacity: 0.95, scale: 0.2}, {opacity: 0, scale: 1.8, duration: 0.6, ease: 'power2.out', immediateRender: false}, t);
    sparks.forEach((sp, q) => { const a = q / sparks.length * Math.PI * 2, r = 170 + (q % 3) * 55;
      tl.fromTo(sp, {opacity: 1, x: 0, y: 0, scale: 1.3}, {opacity: 1, x: Math.cos(a) * r, y: Math.sin(a) * r, scale: 0.9, duration: 0.8, ease: 'expo.out', immediateRender: false}, t);
      tl.to(sp, {opacity: 0, y: `+=${60 + (q % 4) * 14}`, scale: 0.3, duration: 0.7, ease: 'power1.in'}, t + 0.75); });   // l’étincelle retombe en s’éteignant
    cue(t, 'pop', 0.7, (i % 4) + 3);
  });
  confetti($('#ftt b'), W + 0.6);
  show('#fma', W + 0.9, {y: 420, rotation: -6}, 0.9, 'back.out(1.3)'); cue(W + 0.9, 'whoosh', 0.6, 1);
  tl.to('#fma', {y: -34, duration: 0.24, yoyo: true, repeat: 5, ease: 'power2.out'}, W + 2.0);
  cue(W + 2.0, 'pop', 0.6, 3); cue(W + 2.48, 'pop', 0.6, 5); cue(W + 2.96, 'pop', 0.6, 6);
  confetti($('#fma'), W + 2.2);
  tl.to('#ftt b', {scale: 1.04, duration: 0.5, yoyo: true, repeat: 3, ease: 'sine.inOut'}, W + 2.2);
  // et maintenant, la pratique : ses défis
  show('#fpr', A.k5 + 0.4, {y: 30, scale: 0.8}, 0.5, 'back.out(2)'); cue(A.k5 + 0.4, 'pop', 0.7, 4);
  bump('#fpr > span', A.k5 + 1.6, 1.06); cue(A.k5 + 1.6, 'tick', 0.5, 5);
  tl.to('#fpr .emo', {rotation: -18, transformOrigin: '20% 90%', duration: 0.12, yoyo: true, repeat: 3, ease: 'sine.inOut'}, A.k5 + 1.7);
}

Course({duration: DURATION, chapters: CHAPTERS, captions: CAPTIONS, questions: QUESTIONS, picks: [], opens: OPENS,
  glyphs: '🏁🎉💜😉👋✈️🎓⚑✅👥!…«»·−→',
  dom, build});
