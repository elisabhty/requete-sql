<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F2FC">
<meta name="robots" content="noindex">
<title>La base des ateliers · Requête</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!-- Prototype du module « Projet : la base des ateliers » (chapitres 1 et 2).
     Page autonome : styles et script ici, polices et mascotte reprises de l’app.
     Chaque étape se joue au doigt (glisser ou toucher deux fois) comme à la souris. -->
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(../fonts/bricolage-grotesque-regular.woff2) format('woff2');font-weight:300 550;font-style:normal;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(../fonts/bricolage-grotesque-bold.woff2) format('woff2');font-weight:551 900;font-style:normal;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(../fonts/jetbrains-mono.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --bg:#F4F2FC;--surface:#fff;--surface-2:#F1EEFC;--head:#F7F5FE;
  --ink:#221C46;--ink-2:#4E4872;--ink-3:#6A6490;
  --line:#E6E1F6;--line-2:#EFECFA;--lip:#DCD5F2;
  --accent:#6A4DF4;--accent-2:#8B6CFF;--accent-soft:#EEE9FF;--accent-ink:#5335E0;--accent-lip:#4B30CC;--accent-line:#C9BEF7;
  --success:#0F7A3A;--success-fill:#169447;--success-lip:#0F7337;--success-soft:#E2F6EA;--success-line:#BFE6CF;
  --danger:#C2323A;--danger-fill:#EF4F55;--danger-lip:#C4363B;--danger-soft:#FDEBEC;--danger-line:#F6C9CC;
  --fk:#94480A;--fk-soft:#FFF3DC;--fk-line:#F3D19B;--fk-lip:#EBC27F;
  --display:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Monaco,monospace;
  --press:cubic-bezier(.3,.7,.4,1.5);--pop:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
code{font-family:var(--mono)}
.lead code,.fb code,.q-t code,.sub code,.recap code,.memo code,.how code,.cover-goal code{font:600 .84em/1 var(--mono);background:var(--accent-soft);color:var(--accent-ink);padding:3px 7px;border-radius:8px;white-space:nowrap}
.fb.ok code{background:rgba(255,255,255,.7);color:var(--success)}
.fb.err code{background:rgba(255,255,255,.7);color:var(--danger)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- En-tête ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(244,242,252,.94);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.ibtn{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--lip);display:grid;place-items:center;color:var(--accent);cursor:pointer;text-decoration:none;transition:transform .12s var(--press),box-shadow .12s var(--press)}
.ibtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--lip)}
.top-app{font:700 19px/1 var(--display);color:var(--accent-ink)}
.top-mid{flex:1;min-width:0}
.top-lbl{font:600 12.5px/1.2 var(--ui);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 1px 1px}
.prog{display:flex;gap:4px}
.prog button{flex:1;min-width:0;height:22px;border:0;padding:0;background:none;position:relative;cursor:default}
.prog button::before{content:'';position:absolute;left:0;right:0;top:7px;height:8px;border-radius:99px;background:var(--line);transition:background .35s}
.prog button.reach{cursor:pointer}
.prog button.ahead::before{background:var(--success-line)}
.prog button.done::before{background:var(--success-fill)}
.prog button.cur::before{background:var(--accent)}

/* ---------- Page ---------- */
.wrap{max-width:560px;margin:0 auto;padding:6px 16px calc(132px + env(safe-area-inset-bottom,0px))}
.step{animation:stepIn .34s var(--out) both}
.step.leave{animation:stepOut .17s ease-in both}
@keyframes stepIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes stepOut{to{opacity:0;transform:translateX(-18px)}}
.step-title{font:700 27px/1.12 var(--display);letter-spacing:-.02em;margin:14px 0 10px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--ink-2);text-wrap:pretty}
.lead b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font:700 14px/1.1 var(--display)}
.pill.ok{background:var(--success-soft);color:var(--success)}
.h1{font:700 34px/1.04 var(--display);letter-spacing:-.025em;margin:14px 0 10px;text-wrap:balance}
.sub{font-size:16px;line-height:1.5;color:var(--ink-2);margin:0 0 22px;text-wrap:pretty}
.sec{font:700 20px/1.2 var(--display);letter-spacing:-.01em;margin:28px 0 12px}
.how{margin:-4px 0 14px;font-size:13.5px;line-height:1.45;color:var(--ink-3)}
.swipe{display:flex;align-items:center;gap:6px;margin:10px 2px 0;font-size:13.5px;color:var(--ink-3)}
.swipe[hidden]{display:none}

/* ---------- Bouton principal ---------- */
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(244,242,252,0),var(--bg) 32%);pointer-events:none}
.cta-bar[hidden]{display:none}
.cta{pointer-events:auto;display:block;width:100%;max-width:528px;margin:0 auto;min-height:56px;padding:0 18px;border-radius:16px;border:0;font:700 17px/1.2 var(--display);cursor:pointer;transition:transform .12s var(--press),box-shadow .12s var(--press),background .2s,color .2s}
.cta.go{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-lip)}
.cta.go:active{transform:translateY(4px);box-shadow:0 0 0 var(--accent-lip)}
.cta.ok{background:var(--success-fill);color:#fff;box-shadow:0 4px 0 var(--success-lip)}
.cta.ok:active{transform:translateY(4px);box-shadow:0 0 0 var(--success-lip)}
.cta.hint{background:#fff;color:var(--accent-ink);border:2px solid var(--accent-line);box-shadow:0 10px 24px -14px rgba(75,48,204,.45);cursor:default}
.cta.pop{animation:ctaPop .5s var(--pop)}
@keyframes ctaPop{0%{transform:scale(.96)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
.btn-2{display:block;width:100%;min-height:52px;margin-top:12px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--lip);color:var(--accent-ink);font:700 16px/1.2 var(--display);cursor:pointer;transition:transform .12s var(--press),box-shadow .12s var(--press)}
.btn-2:active{transform:translateY(4px);box-shadow:0 0 0 var(--lip)}
.btn-3{display:block;margin:14px auto 0;padding:8px 12px;border:0;background:none;color:var(--ink-3);font:600 14.5px/1.2 var(--ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- Accueil du module ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(135deg,#7C5CFF,#6A4DF4);color:#fff;padding:20px 20px 18px;box-shadow:0 6px 0 var(--accent-lip)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(70% 90% at 85% 0%,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero-row{position:relative;display:flex;gap:12px;align-items:center}
.hero-k{display:block;font:700 14px/1.2 var(--display);opacity:.86}
.hero-t{display:block;font:700 26px/1.08 var(--display);letter-spacing:-.02em;margin:6px 0 6px;text-wrap:balance}
.hero-s{display:block;font-size:14.5px;line-height:1.4;opacity:.9}
.hero-m{flex:none;width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.35)}
.hero-go{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;margin-top:16px;border:0;border-radius:18px;background:#fff;color:var(--accent-ink);font:700 18px/1.2 var(--display);box-shadow:0 5px 0 rgba(43,24,140,.45);cursor:pointer;transition:transform .12s var(--press),box-shadow .12s var(--press)}
.hero-go:active{transform:translateY(5px);box-shadow:0 0 0 rgba(43,24,140,.45)}
.hero-go .pl{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.hero-bar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.hero-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#fff}
.ch-list{position:relative;display:flex;flex-direction:column;gap:12px}
.ch-list::before{content:'';position:absolute;left:36px;top:34px;bottom:34px;width:3px;margin-left:-1.5px;border-radius:3px;background:var(--lip)}
.ch-row{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:20px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--lip);text-align:left;cursor:pointer;transition:transform .12s var(--press),box-shadow .12s var(--press)}
button.ch-row:active{transform:translateY(4px);box-shadow:0 0 0 var(--lip)}
.ch-num{flex:none;width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent-ink);font:700 17px/40px var(--display);text-align:center}
.ch-row.done .ch-num{background:var(--success-fill);color:#fff}
.ch-row.next{border-color:var(--accent-line)}
.ch-row.next .ch-num{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-lip)}
.ch-txt{flex:1;min-width:0}
.ch-t{display:block;font:700 16.5px/1.25 var(--display);color:var(--ink)}
.ch-s{display:block;font-size:13.5px;line-height:1.4;color:var(--ink-3);margin-top:2px}
.ch-st{flex:none;font:700 13.5px/1.2 var(--display);color:var(--accent-ink)}
.ch-row.done .ch-st{color:var(--success)}
.ch-row.soon{cursor:default;background:#FAF9FE;box-shadow:none;border-style:dashed}
.ch-row.soon .ch-num{background:#EEEBF8;color:#9A95BC}
.ch-row.soon .ch-t{color:var(--ink-2)}
.ch-row.soon .ch-st{color:#9A95BC;font-weight:600}

/* ---------- Couverture d’un chapitre ---------- */
.cover-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--lip)}
.cover-m{flex:none;width:96px;height:auto}
.cover-k{display:block;font:700 13.5px/1.2 var(--display);color:var(--accent-ink);margin-bottom:4px}
.cover-goal{margin:0;font-size:16px;line-height:1.5;color:var(--ink)}
.cover-meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.cover-meta li{padding:7px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);font:600 13.5px/1.2 var(--ui);color:var(--ink-2)}

/* ---------- Tableur ---------- */
.xl{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--lip)}
.xl-bar{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:2px solid var(--line-2);font:600 13px/1.2 var(--ui);color:var(--ink-2)}
.xl-ico{flex:none;width:22px;height:22px;border-radius:6px;background:#1E7B4B;color:#fff;font:800 12px/22px var(--ui);text-align:center}
.xl-sc{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.xl-t{border-collapse:separate;border-spacing:0;font:500 13.5px/1.3 var(--ui);color:var(--ink)}
.xl-t th,.xl-t td{padding:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);white-space:nowrap;text-align:left;background:#fff;transition:background .2s}
.xl-t th:last-child,.xl-t td:last-child{border-right:0}
.xl-t tbody tr:last-child td{border-bottom:0}
.xl-t .cell{display:block;padding:9px 11px;max-height:64px;overflow:hidden;transition:max-height .3s ease,padding .3s ease,opacity .25s,background .2s,box-shadow .2s,color .2s}
.xl-t thead th{background:var(--head);font-weight:700;font-size:12.5px;color:var(--ink-2)}
.xl-t .rn{position:sticky;left:0;z-index:2;width:30px;min-width:30px;max-width:30px;background:var(--head);text-align:center}
.xl-t .rn,.xl-t .rn .cell{color:var(--ink-3);font:600 11px/1.3 var(--mono);padding-left:0;padding-right:0}
.xl-t .c1{position:sticky;left:30px;z-index:2;box-shadow:inset -1px 0 0 var(--line)}
.xl-fade{position:absolute;top:43px;right:0;bottom:0;width:30px;background:linear-gradient(to right,rgba(255,255,255,0),#fff 85%);pointer-events:none;transition:opacity .2s}
.xl.at-end .xl-fade{opacity:0}
.xl-t td.tap{cursor:pointer}
.xl-t td.tap:active .cell{background:var(--surface-2)}
.xl-t td.hit .cell{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-ink);font-weight:700;animation:cellHit .45s var(--pop)}
.xl-t td.miss .cell{animation:cellMiss .5s ease}
@keyframes cellHit{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes cellMiss{0%,100%{background:#fff;transform:none}20%{background:var(--danger-soft);transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.xl-t tr.row-tap{cursor:pointer}
.xl-t tr.row-tap:active td{background:var(--surface-2)}
.xl-t tr.shake-row td{animation:rowShake .45s ease}
@keyframes rowShake{0%,100%{background:#fff}30%{background:var(--danger-soft)}}
.xl-t tr.del td{background:var(--danger-soft)}
.xl-t tr.del .cell{color:var(--danger);text-decoration:line-through}
.xl-t tr.gone td{border-bottom-color:transparent}
.xl-t tr.gone .cell{max-height:0;padding-top:0;padding-bottom:0;opacity:0}
.xl-t tr.row-new td{background:#FBFAFF;animation:rowIn .5s var(--out) both}
@keyframes rowIn{from{opacity:0}to{opacity:1}}
.xl-t td.ask .cell{color:var(--accent-ink);font-weight:800;text-align:center;box-shadow:inset 0 0 0 2px var(--accent);border-radius:4px;background:var(--accent-soft);animation:askPulse 1.6s ease-in-out infinite}
@keyframes askPulse{0%,100%{box-shadow:inset 0 0 0 2px var(--accent)}50%{box-shadow:inset 0 0 0 2px var(--accent-line)}}
.counter{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 13px;border-radius:999px;background:#fff;border:2px solid var(--line);font:600 14px/1.2 var(--ui);color:var(--ink-2)}
.counter b{font:700 16px/1 var(--display);color:var(--accent-ink)}
.counter.bump b{animation:cellHit .4s var(--pop)}
.counter.full{background:var(--success-soft);border-color:var(--success-line);color:var(--success)}
.counter.full b{color:var(--success)}

/* ---------- Tables de la base ---------- */
.tables{display:flex;flex-direction:column;gap:14px}
.tb{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--lip);overflow:hidden;transition:border-color .2s,background .2s,transform .2s var(--out),box-shadow .2s}
.tb-h{display:flex;align-items:center;gap:8px;padding:10px 12px 9px;font:700 15px/1.2 var(--display)}
.tb-e{font-size:17px;line-height:1}
.tb-l{color:var(--ink-3);font-weight:600}
.tb-h code{font:700 14.5px/1 var(--mono);color:var(--ink)}
.tb-b{margin-left:auto;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font:600 11.5px/1.2 var(--ui);white-space:nowrap}
.tb-sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tb-t{border-collapse:collapse;width:100%;font:500 13px/1.3 var(--ui)}
.tb-t th{font:600 12px/1.2 var(--mono);color:var(--ink-2);text-align:left;padding:7px 9px;background:var(--head);border-top:1px solid var(--line-2);white-space:nowrap}
.tb-t td{padding:8px 9px;border-top:1px solid var(--line-2);white-space:nowrap;transition:background .25s}
.tb-t td.num{font:600 12.5px/1.3 var(--mono)}
.tb-t th.pk{color:var(--accent-ink)}
.tb-t th.fk{color:var(--fk)}
.tb-t th .ki{margin-right:3px;font-size:11px}
.tb-t th .ki+.ki{margin-left:-1px}
.tb-t th .uq{margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--fk-soft);border:1px solid var(--fk-line);color:var(--fk);font:700 10.5px/1.4 var(--ui);letter-spacing:.02em}
.tb-t .nb{display:inline-block;min-width:22px;padding:1px 6px;margin-right:4px;border-radius:7px;background:var(--fk-soft);border:1px solid var(--fk-line);color:var(--fk);font:700 12.5px/18px var(--mono);text-align:center}
.tb-t .mute{color:#B4AFD2;font-family:var(--mono)}
.tb-key{margin:0 12px 9px;padding:6px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font:600 13px/1.3 var(--ui);animation:tdIn .45s var(--pop) both}
.tb-key code{font:700 12px/1 var(--mono)}
.tb-t th.pkc{box-shadow:inset 0 -3px 0 var(--accent-line)}
.tb-more{padding:7px 12px 9px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3)}
.tb-t th.nc{animation:thIn .55s ease both}
.tb-t td.nc{animation:tdIn .5s var(--pop) both}
@keyframes thIn{0%{opacity:0;background:var(--accent-soft)}40%{opacity:1;background:var(--accent-soft)}100%{background:var(--head)}}
@keyframes tdIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:none}}
.tb-t .nc.out{animation:colOut .25s ease forwards}
@keyframes colOut{to{opacity:0}}
.tb-t td.over{background:var(--danger-soft);position:relative}
.tb-t td.over .nb{background:var(--danger-fill);border-color:var(--danger-fill);color:#fff;animation:nbShake .45s ease}
.tb-t td.over .x{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:2px;border-radius:50%;background:var(--danger-fill);color:#fff;font:800 12px/1 var(--ui);vertical-align:-4px;animation:tdIn .4s var(--pop) both}
@keyframes nbShake{0%,100%{transform:none}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.tb-t tr.add td{animation:rowAdd .7s var(--out) both}
@keyframes rowAdd{0%{opacity:0;background:var(--success-soft)}35%{opacity:1;background:var(--success-soft)}100%{background:#fff}}
.tb-t tr.try td{background:#FBFAFF;color:var(--ink-2);border-top:2px dashed var(--accent-line)}
.tb-t tr.try.refused td{background:var(--danger-soft);color:var(--danger);text-decoration:line-through}
.tb-t tr.try.refused .nb{background:var(--danger-fill);border-color:var(--danger-fill);color:#fff}
[hidden]{display:none!important}
.tb-t tr.focus td{background:var(--accent-soft)}
.tb.pick{cursor:pointer}
.tb.pick:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.tb.armed{border-style:dashed;border-color:var(--accent-line)}
.tb.over{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.015)}
.tb.nope{animation:lqShake .45s ease;border-color:var(--danger-fill)}
.tb.yes{border-color:var(--success-fill);box-shadow:0 4px 0 var(--success-line)}
.tb-t .slot{padding:5px 8px}
.slot-in{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 8px;border-radius:9px;border:2px dashed var(--accent-line);background:#FBFAFF;color:var(--accent-ink);font:700 13px/1 var(--mono);transition:background .15s,border-color .15s,transform .15s}
.slot.armed .slot-in{border-color:var(--accent);background:var(--accent-soft)}
.slot.over .slot-in{border-style:solid;border-color:var(--accent);background:var(--accent-soft);transform:scale(1.08)}
.slot.nope .slot-in{animation:lqShake .45s ease;border-color:var(--danger-fill);background:var(--danger-soft)}
.slot.filled .slot-in{border:1px solid var(--fk-line);background:var(--fk-soft);color:var(--fk);min-width:28px;height:22px;animation:cellHit .45s var(--pop)}

/* ---------- Étiquettes à glisser ---------- */
.tray{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 14px;min-height:46px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:46px;padding:9px 15px;border-radius:15px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--lip);font:600 15.5px/1.2 var(--ui);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s var(--press),box-shadow .12s var(--press),border-color .15s,background .15s,opacity .2s}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lip)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.chip.dragging{opacity:.28}
.chip.used{animation:chipOut .28s ease forwards;pointer-events:none}
@keyframes chipOut{to{opacity:0;transform:scale(.6)}}
.chip.key{background:var(--fk-soft);border-color:var(--fk-line);color:#7A3B05;box-shadow:0 3px 0 var(--fk-lip)}
.chip.key.sel{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.chip .ki{font-size:15px}
.chip.num{flex-direction:column;align-items:flex-start;gap:1px;min-height:52px;padding:7px 12px}
.chip.num b{font:700 16px/1 var(--mono);color:var(--fk)}
.chip.num small{font:500 12px/1.2 var(--ui);color:var(--ink-3)}
.chip:disabled{cursor:default}
.ghost{position:fixed!important;left:0;top:0;z-index:100;margin:0!important;pointer-events:none;opacity:1!important;box-shadow:0 18px 32px -12px rgba(34,28,70,.45)!important;border-color:var(--accent)!important}
.shake{animation:lqShake .45s ease}
.grp{margin:18px 0 6px;font:700 12.5px/1.2 var(--ui);color:var(--ink-3);letter-spacing:.01em}
.grp+.tray{margin-bottom:4px}
.solo{justify-content:center;margin:4px 0 18px}

/* ---------- Bacs (tri des colonnes) ---------- */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{position:relative;min-height:128px;padding:11px 11px 12px;border-radius:18px;border:2px dashed #D5CCF3;background:rgba(255,255,255,.7);cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--out)}
.bin.armed{border-color:#B9A9F5;background:#fff}
.bin.over{border-color:var(--accent);border-style:solid;background:var(--accent-soft);transform:scale(1.02)}
.bin.nope{animation:lqShake .45s ease;border-color:var(--danger-fill)}
.bin.yes{border-color:var(--success-fill);border-style:solid}
.bin-h{display:flex;align-items:center;gap:7px;font:700 15px/1.2 var(--display)}
.bin-h code{font:700 14px/1 var(--mono);color:var(--ink)}
.bin-s{font-size:12.5px;line-height:1.35;color:var(--ink-3);margin-top:3px}
.bin-cols{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.col{display:inline-block;font:600 12px/1 var(--mono);padding:5px 7px;border-radius:8px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.col.old{color:var(--ink-3);background:var(--head)}
.col.new{animation:tdIn .45s var(--pop) both;background:var(--success-soft);border-color:var(--success-line);color:#0B5A2C}
.col.flash{animation:colFlash .7s ease}
@keyframes colFlash{0%,100%{background:var(--head)}40%{background:var(--success-soft)}}
.col.pk{background:var(--accent-soft);border-color:#D9CFFF;color:var(--accent-ink)}
.col.fk{background:var(--fk-soft);border-color:var(--fk-line);color:var(--fk)}

/* ---------- Questions ---------- */
.q{margin-top:22px}
.q-t{font:700 19px/1.3 var(--display);letter-spacing:-.01em;margin:0 0 12px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--lip);font:500 16px/1.35 var(--ui);color:var(--ink);text-align:left;cursor:pointer;transition:transform .12s var(--press),box-shadow .12s var(--press),border-color .15s,background .15s,opacity .2s}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--lip)}
.opt .ql{flex:none;width:32px;height:32px;border-radius:11px;background:var(--surface-2);border:2px solid var(--line);color:var(--ink-2);font:700 14px/28px var(--display);text-align:center}
.opt.bon{border-color:var(--success-fill);background:var(--success-soft);box-shadow:0 4px 0 var(--success-fill);animation:lqCorrect .5s var(--pop)}
.opt.bon .ql{background:var(--success-fill);border-color:var(--success-fill);color:#fff}
.opt.faux{border-color:var(--danger-fill);background:var(--danger-soft);box-shadow:0 4px 0 var(--danger-fill);animation:lqShake .45s ease}
.opt.faux .ql{background:var(--danger-fill);border-color:var(--danger-fill);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.bon):not(.faux){opacity:.5}
.opt:disabled:active{transform:none;box-shadow:0 4px 0 var(--lip)}
.opt.bon:disabled:active{box-shadow:0 4px 0 var(--success-fill)}
.opt.faux:disabled:active{box-shadow:0 4px 0 var(--danger-fill)}

/* ---------- Retours ---------- */
.fb{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 15px;border-radius:20px;border:2px solid transparent;font-size:15.5px;line-height:1.55;text-wrap:pretty}
.fb .fi{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 16px/1 var(--ui);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.fb .ft{display:block;font:700 16.5px/1.3 var(--display);margin-bottom:2px}
.fb.ok{background:var(--success-soft);border-color:var(--success-line);color:#0D4A26;animation:lqCorrect .5s var(--pop)}
.fb.ok .fi{background:var(--success-fill)}
.fb.ok .ft{color:var(--success)}
.fb.err{background:var(--danger-soft);border-color:var(--danger-line);color:#6E1D22;animation:lqShake .45s ease}
.fb.err .fi{background:var(--danger-fill)}
.fb.err .ft{color:var(--danger)}
.fb.mini{padding:10px 13px;font-size:14.5px;align-items:center}
.fb.mini .fi{width:24px;height:24px;border-radius:8px;font-size:13px}
@keyframes lqCorrect{0%{transform:scale(1)}35%{transform:scale(1.04)}70%{transform:scale(.99)}100%{transform:scale(1)}}
@keyframes lqShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.memo{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--fk-soft);border:2px solid var(--fk-line);color:#5E3105;font-size:14.5px;line-height:1.5}
.memo .me{font-size:18px;line-height:1.3}

/* ---------- Liens à tracer ---------- */
.lk{margin-top:4px}
.lk-head{display:grid;grid-template-columns:minmax(0,1fr) clamp(44px,12vw,96px) minmax(0,1fr);align-items:center;margin:0 0 10px}
.lk-head code{font:700 13.5px/1 var(--mono);color:var(--ink-2);background:#fff;border:2px solid var(--line);border-radius:9px;padding:5px 8px}
.lk-hl{text-align:left}
.lk-hr{text-align:right}
.lk-rel{justify-self:center;padding:4px 7px;border-radius:9px;background:var(--success-fill);color:#fff;font:800 13px/1.2 var(--display);white-space:nowrap;box-shadow:0 3px 0 var(--success-lip);opacity:0;transform:scale(.5)}
.lk-rel.on{opacity:1;transform:none;transition:opacity .2s,transform .45s var(--pop)}
.lk-body{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(44px,12vw,96px) minmax(0,1fr)}
.lk-col{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.lk-l{grid-column:1}
.lk-r{grid-column:3}
.lk-node{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:58px;padding:9px 9px 9px 10px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--lip);text-align:left;font:600 14.5px/1.25 var(--ui);color:var(--ink);cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:border-color .15s,background .15s,box-shadow .15s,transform .12s var(--press)}
.lk-node:active{transform:translateY(2px)}
.lk-node .dot{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--accent-line);transition:background .15s,border-color .15s}
.lk-l .lk-node .dot{right:-10px}
.lk-r .lk-node .dot{left:-10px}
.lk-node .nt{display:flex;flex-direction:column;min-width:0}
.lk-node .nt b{font-weight:700;-webkit-hyphens:auto;hyphens:auto}
.lk-node small{display:block;margin-top:2px;font:500 12px/1.3 var(--ui);color:var(--ink-3)}
.lk-node .emo{flex:none;font-size:18px;line-height:1}
.lk-node .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font:700 12px/30px var(--display);text-align:center}
.lk-node .av.b{background:#E3F1FF;color:#1D5FA8}
.lk-node .av.c{background:#FFE9E3;color:#A8401D}
.lk-node.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.lk-node.sel .dot,.lk-node.hot .dot{border-color:var(--accent);background:var(--accent)}
.lk-node.hot{border-color:var(--accent);background:var(--accent-soft)}
.lk-node.done{border-color:var(--success-line)}
.lk-node.done .dot{border-color:var(--success-fill);background:var(--success-fill)}
.lk.picking .lk-node:not(.sel){border-color:#D9D0F8}
.lk.ro .lk-node,.lk.locked .lk-node{cursor:default}
.lk.ro .lk-node:active,.lk.locked .lk-node:active{transform:none}
.lk-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.lk-svg path{fill:none;stroke-width:3.5;stroke-linecap:round}
.lk-svg .ln{stroke:var(--success-fill)}
.lk-svg .rb{stroke:var(--accent);stroke-dasharray:1 8;stroke-width:4}
.lk-svg .bad{stroke:var(--danger-fill);animation:badFade .7s ease forwards}
@keyframes badFade{0%,55%{opacity:1}100%{opacity:0}}

/* ---------- Schéma final ---------- */
.chain{margin-top:4px}
.sc{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--lip);padding:11px 12px 12px;animation:stepIn .4s var(--out) both}
.sc-h{display:flex;align-items:center;gap:8px;font:700 15px/1.2 var(--display)}
.sc-h code{font:700 14.5px/1 var(--mono)}
.sc-cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.cn{position:relative;height:54px;animation:cnIn .4s var(--out) both}
@keyframes cnIn{from{opacity:0;transform:scaleY(.3)}to{opacity:1;transform:none}}
.cn::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent-line)}
.cn .m{position:absolute;left:calc(50% + 9px);min-width:24px;height:22px;padding:0 6px;border-radius:7px;background:#fff;border:2px solid var(--accent-line);color:var(--accent-ink);font:800 12.5px/18px var(--display);text-align:center}
.cn .m.t{top:3px}
.cn .m.b{bottom:3px}
.cn .v{position:absolute;right:calc(50% + 12px);top:50%;transform:translateY(-50%);font:600 12.5px/1.2 var(--ui);color:var(--ink-3);white-space:nowrap}

/* ---------- Fin de chapitre ---------- */
.end-hero{display:flex;align-items:center;gap:14px;margin-top:10px}
.end-m{flex:none;width:104px;height:auto;animation:mascot 1.1s var(--pop) both}
@keyframes mascot{0%{opacity:0;transform:translateY(16px) scale(.85)}60%{opacity:1;transform:translateY(-4px) scale(1.03)}100%{transform:none}}
.end-t{font:700 28px/1.1 var(--display);letter-spacing:-.02em;margin:10px 0 6px;text-wrap:balance}
.end-s{margin:0;color:var(--ink-2);font-size:16px;line-height:1.45}
.recap{margin-top:22px;padding:16px;border-radius:22px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--lip)}
.recap-h{font:700 18px/1.2 var(--display);margin:2px 0 12px}
.rr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:2px solid var(--line-2)}
.rr:first-of-type{border-top:0;padding-top:4px}
.rr .re{flex:none;width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:20px}
.rr p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink);text-wrap:pretty}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.9s cubic-bezier(.25,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}

.fb-host:empty{display:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bin:focus-visible,.tb:focus-visible{outline-offset:3px}
@media (max-width:400px){
  .tb-t th{padding:7px 6px;font-size:11.5px}
  .tb-t td{padding:8px 6px}
  .tb-t th:first-child,.tb-t td:first-child{padding-left:10px}
}
@media (min-width:720px){
  .wrap{padding-top:16px}
  .step-title{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<body>
<div id="app"></div>
<div id="cta-bar" class="cta-bar" hidden><button id="cta" class="cta" type="button"></button></div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:24px">Ce cours interactif a besoin de JavaScript.</p></noscript>
<script>
(() => {
'use strict';

/* ================================================================
   Outils
   ================================================================ */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
/* Typographie française : espace insécable avant « : ; ! ? » et dans les guillemets,
   autour des flèches de relation (1 → N) et entre un jour et son mois (5 septembre),
   pour que rien de tout cela ne se coupe en fin de ligne. */
const fr = s => String(s)
  .replace(/ ([:;!?»])/g, '\u00a0$1')
  .replace(/« /g, '«\u00a0')
  .replace(/ ([→↔]) /g, '\u00a0$1\u00a0')
  .replace(/(\d|1er) (janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)/g, '$1\u00a0$2');
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = fr(html); return e; };
const wait = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 40) : ms));
const buzz = n => { try { if (navigator.vibrate) navigator.vibrate(n); } catch (e) {} };
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const say = t => { const l = document.getElementById('live'); l.textContent = ''; setTimeout(() => { l.textContent = t.replace(/<[^>]+>/g, ''); }, 30); };
const I_BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
const I_CLOSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const I_PLAY = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="#fff"/></svg>';
const I_SWIPE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ================================================================
   Le cas : les ateliers NutriBoost
   ================================================================ */
const COACHS = [
  {id: 1, prenom: 'Camille', nom: 'Roux', email: 'camille@nutriboost.fr', ini: 'CR'},
  {id: 2, prenom: 'Thomas', nom: 'Girard', email: 'thomas@nutriboost.fr', ini: 'TG'},
];
/* Yoga du matin (id 4) n’existe qu’à partir de l’étape où on l’ajoute à la table ateliers. */
const ATELIERS = [
  {id: 1, titre: 'Récupération', jour: '12/09', date: '2026-09-12', coach: 1, emo: '🥗'},
  {id: 2, titre: 'Cuisine saine', jour: '19/09', date: '2026-09-19', coach: 1, emo: '🍳'},
  {id: 3, titre: 'Gainage doux', jour: '26/09', date: '2026-09-26', coach: 2, emo: '🧘'},
  {id: 4, titre: 'Yoga du matin', jour: '03/10', date: '2026-10-03', coach: 2, emo: '🌅'},
];
const CLIENTS = [
  {id: 1, prenom: 'Sophie', nom: 'Martin', ini: 'SM', av: ''},
  {id: 4, prenom: 'Nathan', nom: 'Petit', ini: 'NP', av: 'b'},
  {id: 7, prenom: 'Léa', nom: 'Simon', ini: 'LS', av: 'c'},
];
const INSCR = [
  {client: 1, atelier: 1, jour: '01/09', date: '2026-09-01'},
  {client: 4, atelier: 1, jour: '02/09', date: '2026-09-02'},
  {client: 7, atelier: 2, jour: '04/09', date: '2026-09-04'},
  {client: 1, atelier: 3, jour: '05/09', date: '2026-09-05'},
];
const CO = id => COACHS.find(x => x.id === id);
const AT = id => ATELIERS.find(x => x.id === id);
const CL = id => CLIENTS.find(x => x.id === id);
const full = p => p.prenom + ' ' + p.nom;
const ICON = {clients: '👥', coachs: '🧑‍🏫', ateliers: '📅', inscriptions: '📝', profils: '🪪'};

/* ================================================================
   Composants
   ================================================================ */

/* --- Le tableur des inscriptions --- */
const SHEET_COLS = [['client', 'client'], ['atelier', 'atelier'], ['jour', 'date'], ['coach', 'coach'], ['email', 'e-mail du coach'], ['le', 'inscrit le']];
function sheetRows() {
  return INSCR.map(i => {
    const a = AT(i.atelier), c = CO(a.coach), cl = CL(i.client);
    return {client: full(cl), atelier: a.titre, jour: a.jour, coach: full(c), email: c.email, le: i.jour, cid: cl.id, aid: a.id, coachId: c.id};
  });
}
function sheet(rows) {
  const box = h('div', 'xl');
  box.innerHTML = '<div class="xl-bar"><span class="xl-ico" aria-hidden="true">X</span><span>inscriptions-ateliers.xlsx</span></div>';
  const sc = h('div', 'xl-sc');
  const t = document.createElement('table'); t.className = 'xl-t';
  t.innerHTML = '<thead><tr><th class="rn"><span class="cell">1</span></th>' +
    SHEET_COLS.map(([, l], j) => `<th class="${j ? '' : 'c1'}" scope="col"><span class="cell">${l}</span></th>`).join('') + '</tr></thead><tbody>' +
    rows.map((r, i) => `<tr data-r="${i}"><td class="rn"><span class="cell">${i + 2}</span></td>` +
      SHEET_COLS.map(([k], j) => `<td class="${j ? '' : 'c1'}" data-c="${k}"><span class="cell">${r[k]}</span></td>`).join('') + '</tr>').join('') +
    '</tbody>';
  sc.append(t); box.append(sc, h('div', 'xl-fade'));
  const upd = () => box.classList.toggle('at-end', sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 4);
  sc.addEventListener('scroll', upd, {passive: true});
  requestAnimationFrame(upd);
  return {box, sc, t};
}

/* --- Une table de la base --- */
const colHead = c => (/pk/.test(c.k || '') ? '<span class="ki">🔑</span>' : '') + (/fk/.test(c.k || '') ? '<span class="ki">🔗</span>' : '') + c.n + (c.u ? '<span class="uq">UNIQUE</span>' : '');
function dbTable(name, cols, rows, o = {}) {
  const card = h('div', 'tb');
  card.dataset.t = name;
  card.innerHTML = fr(`<div class="tb-h"><span class="tb-e" aria-hidden="true">${ICON[name]}</span><span class="tb-l">table</span><code>${name}</code>${o.badge ? `<span class="tb-b">${o.badge}</span>` : ''}</div>` +
    `<div class="tb-sc"><table class="tb-t"><thead><tr>${cols.map(c => `<th class="${c.k || ''}" scope="col">${colHead(c)}</th>`).join('')}</tr></thead>` +
    `<tbody>${rows.map(r => `<tr>${r.map((v, j) => `<td class="${cols[j].k || cols[j].num ? 'num' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` +
    (o.more ? `<div class="tb-more">${o.more}</div>` : ''));
  return card;
}
const nb = v => `<b class="nb">${v}</b>`;
/* Les tables du cas, selon l’avancée du projet. */
const T = {
  coachs: (o = {}) => dbTable('coachs',
    [...(o.id ? [{n: 'id', k: 'pk'}] : []), {n: 'prenom'}, {n: 'nom'}, {n: 'email'}],
    COACHS.map(c => [...(o.id ? [c.id] : []), c.prenom, c.nom, c.email])),
  ateliers: (o = {}) => dbTable('ateliers',
    [...(o.id ? [{n: 'id', k: 'pk'}] : []), {n: 'titre'}, {n: 'date_atelier'}, ...(o.fk ? [{n: 'coach_id', k: 'fk'}] : [])],

/* --- Défilement automatique pendant un glisser --- */
let asRaf = 0, asY = 0, asCb = null;
function autoScroll(y, cb) { asY = y; asCb = cb; if (!asRaf) asRaf = requestAnimationFrame(asTick); }
function asTick() {
  asRaf = 0;
  const top = 96, bot = innerHeight - 112;
  let d = 0;
  if (asY < top) d = -Math.min(16, (top - asY) / 4 + 2);
  else if (asY > bot) d = Math.min(16, (asY - bot) / 4 + 2);
  if (d) {
    const before = scrollY; scrollBy(0, d);
    if (scrollY !== before) { if (asCb) asCb(); asRaf = requestAnimationFrame(asTick); }
  }
}
function stopAutoScroll() { cancelAnimationFrame(asRaf); asRaf = 0; asCb = null; }

/* --- Glisser-déposer, ou toucher l’étiquette puis la cible --- */
function dnd({items, targets, onDrop}) {
  let sel = null;
  const arm = on => targets.forEach(t => t.classList.toggle('armed', on));
  const select = it => {
    if (sel) { sel.classList.remove('sel'); sel.setAttribute('aria-pressed', 'false'); }
    sel = it && it !== sel ? it : null;
    if (sel) { sel.classList.add('sel'); sel.setAttribute('aria-pressed', 'true'); }
    arm(!!sel);
  };
  items.forEach(it => {
    it.setAttribute('aria-pressed', 'false');
    it.addEventListener('pointerdown', e => {
      if ((e.pointerType === 'mouse' && e.button !== 0) || it.disabled) return;
      const sx = e.clientX, sy = e.clientY, r0 = it.getBoundingClientRect();
      let ghost = null, over = null, lx = sx, ly = sy;
      try { it.setPointerCapture(e.pointerId); } catch (err) {}
      const hover = () => {
        const el = document.elementFromPoint(lx, ly);
        const t = el && el.closest('[data-drop]');
        const tt = targets.includes(t) ? t : null;
        if (tt !== over) { if (over) over.classList.remove('over'); over = tt; if (over) over.classList.add('over'); }
      };
      const place = () => { ghost.style.transform = `translate(${lx - r0.width / 2}px,${ly - r0.height / 2 - 10}px) rotate(-3deg) scale(1.06)`; };
      const move = ev => {
        lx = ev.clientX; ly = ev.clientY;
        if (!ghost) {
          if (Math.hypot(lx - sx, ly - sy) < 8) return;
          select(null);
          ghost = it.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
          ghost.style.width = r0.width + 'px'; ghost.removeAttribute('id');
          document.body.append(ghost); it.classList.add('dragging'); arm(true);
        }
        place(); hover(); autoScroll(ly, hover);
      };
      const end = cancel => {
        it.removeEventListener('pointermove', move); it.removeEventListener('pointerup', up); it.removeEventListener('pointercancel', cc);
        stopAutoScroll();
        if (!ghost) return;
        it._noClick = performance.now() + 450;
        it.classList.remove('dragging'); arm(false);
        if (over) over.classList.remove('over');
        const gr = ghost.getBoundingClientRect();
        if (over && !cancel) { ghost.remove(); onDrop(it, over, gr); }
        else {
          const r = it.getBoundingClientRect();
          ghost.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)';
          ghost.style.transform = `translate(${r.left}px,${r.top}px)`;
          setTimeout(() => ghost.remove(), 260);
        }
      };
      const up = () => end(false), cc = () => end(true);
      it.addEventListener('pointermove', move); it.addEventListener('pointerup', up); it.addEventListener('pointercancel', cc);
    });
    it.addEventListener('click', () => {
      if (it._noClick && performance.now() < it._noClick) return;
      if (it.disabled) return;
      select(it);
    });
  });
  targets.forEach(t => {
    t.dataset.drop = '1';
    if (!t.matches('button')) { t.tabIndex = 0; t.setAttribute('role', 'button'); }
    const act = () => { if (!sel) return; const it = sel; const r = it.getBoundingClientRect(); select(null); onDrop(it, t, r); };
    t.addEventListener('click', act);
    t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  });
  return {select};
}
/* Une copie de l’étiquette vole jusqu’à sa cible. */
function fly(fromRect, toEl, srcEl) {
  if (RM || !fromRect || !toEl) return;
  const to = toEl.getBoundingClientRect();
  const g = srcEl.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel', 'dragging', 'used');
  g.style.width = fromRect.width + 'px'; document.body.append(g);
  const tx = to.left + Math.min(to.width, 120) / 2 - fromRect.width / 2, ty = to.top + Math.min(to.height, 40) / 2 - fromRect.height / 2;
  g.animate([
    {transform: `translate(${fromRect.left}px,${fromRect.top}px) scale(1.04)`, opacity: 1},
    {transform: `translate(${tx}px,${ty}px) scale(.55)`, opacity: .15},
  ], {duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards'}).finished.then(() => g.remove(), () => g.remove());
}

/* --- Liens à tracer entre deux colonnes --- */
function linker(ctx, host, o) {
  const box = h('div', 'lk' + (o.ro ? ' ro' : ''));
  const head = h('div', 'lk-head', `<span class="lk-hl"><code>${o.lh}</code></span><span class="lk-rel"></span><span class="lk-hr"><code>${o.rh}</code></span>`);
  const body = h('div', 'lk-body');
  const L = h('div', 'lk-col lk-l'), R = h('div', 'lk-col lk-r');
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'lk-svg'); svg.setAttribute('aria-hidden', 'true');
  body.append(L, R, svg); box.append(head, body); host.append(box);
  const node = (side, it) => {
    const b = h('button', 'lk-node', `${it.html}<i class="dot" aria-hidden="true"></i>`);
    b.type = 'button'; b.dataset.side = side; b.dataset.k = it.k;
    if (o.ro) b.tabIndex = -1;
    (side === 'l' ? L : R).append(b); return b;
  };
  const LN = o.left.map(it => node('l', it)), RN = o.right.map(it => node('r', it));
  const byK = k => [...LN, ...RN].find(n => n.dataset.k === k);
  const links = [];
  const pt = n => { const d = n.querySelector('.dot').getBoundingClientRect(), bb = body.getBoundingClientRect(); return [d.left + d.width / 2 - bb.left, d.top + d.height / 2 - bb.top]; };
  const curve = (p, q) => { const dx = Math.max(16, (q[0] - p[0]) * .55); return `M${p[0].toFixed(1)},${p[1].toFixed(1)} C${(p[0] + dx).toFixed(1)},${p[1].toFixed(1)} ${(q[0] - dx).toFixed(1)},${q[1].toFixed(1)} ${q[0].toFixed(1)},${q[1].toFixed(1)}`; };
  const path = cls => { const p = document.createElementNS(NS, 'path'); p.setAttribute('class', cls); svg.append(p); return p; };
  const redraw = () => links.forEach(l => l.p.setAttribute('d', curve(pt(l.a), pt(l.b))));
  if (window.ResizeObserver) new ResizeObserver(redraw).observe(body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
  const addLink = (a, b, anim) => {
    const p = path('ln'); links.push({a, b, p});
    p.setAttribute('d', curve(pt(a), pt(b)));
    if (anim && !RM && p.getTotalLength) {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.getBoundingClientRect();
      p.style.transition = 'stroke-dashoffset .38s ease-out'; p.style.strokeDashoffset = '0';
      setTimeout(() => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; p.style.transition = ''; }, 420);
    }
    a.classList.add('done'); b.classList.add('done');
  };
  const api = {box, rel(txt) { const r = head.querySelector('.lk-rel'); r.textContent = fr(txt); r.classList.add('on'); }};
  if (o.preset) requestAnimationFrame(() => o.preset.forEach(([l, r], i) => setTimeout(() => addLink(byK(l), byK(r), true), 120 + i * 160)));
  if (o.ro) return api;

  const total = o.valid.size;
  const attempt = (x, y) => {
    if (x.dataset.side === y.dataset.side) return;
    const a = x.dataset.side === 'l' ? x : y, b = a === x ? y : x;
    if (links.some(l => l.a === a && l.b === b)) return;
    if (o.valid.has(a.dataset.k + ':' + b.dataset.k)) {
      addLink(a, b, true); buzz(8); ctx.clear();
      if (links.length === total) { box.classList.add('locked'); if (o.onDone) setTimeout(o.onDone, RM ? 0 : 380); }
    } else {
      const p = path('bad'); p.setAttribute('d', curve(pt(a), pt(b)));
      restart(a, 'shake'); restart(b, 'shake');
      ctx.err(o.wrong(a.dataset.k, b.dataset.k), 'Pas ce lien.');
      setTimeout(() => p.remove(), 720);
    }
  };
  let sel = null;
  const setSel = n => { if (sel) sel.classList.remove('sel'); sel = n; if (sel) sel.classList.add('sel'); box.classList.toggle('picking', !!sel); };
  [...LN, ...RN].forEach(n => {
    n.addEventListener('click', () => {
      if (box.classList.contains('locked') || (n._noClick && performance.now() < n._noClick)) return;
      if (!sel) return setSel(n);
      if (sel === n) return setSel(null);
      if (sel.dataset.side === n.dataset.side) return setSel(n);
      const a = sel; setSel(null); attempt(a, n);
    });
    n.addEventListener('pointerdown', e => {
      if (box.classList.contains('locked') || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const sx = e.clientX, sy = e.clientY;
      let rub = null, hot = null, lx = sx, ly = sy;
      try { n.setPointerCapture(e.pointerId); } catch (err) {}
      const hover = () => {
        const el = document.elementFromPoint(lx, ly);
        const t = el && el.closest('.lk-node');
        const tt = t && t.parentNode.parentNode === body && t.dataset.side !== n.dataset.side ? t : null;
        if (tt !== hot) { if (hot) hot.classList.remove('hot'); hot = tt; if (hot) hot.classList.add('hot'); }
        if (rub) { const bb = body.getBoundingClientRect(), p0 = pt(n), p1 = [lx - bb.left, ly - bb.top]; rub.setAttribute('d', n.dataset.side === 'l' ? curve(p0, p1) : curve(p1, p0)); }
      };
      const move = ev => {
        lx = ev.clientX; ly = ev.clientY;
        if (!rub) { if (Math.hypot(lx - sx, ly - sy) < 8) return; setSel(null); rub = path('rb'); n.classList.add('sel'); }
        hover(); autoScroll(ly, hover);
      };
      const end = cancel => {
        n.removeEventListener('pointermove', move); n.removeEventListener('pointerup', up); n.removeEventListener('pointercancel', cc);
        stopAutoScroll();
        if (!rub) return;
        n._noClick = performance.now() + 450;
        rub.remove(); n.classList.remove('sel');
        const t = hot; if (hot) hot.classList.remove('hot');
        if (t && !cancel) attempt(n, t);
      };
      const up = () => end(false), cc = () => end(true);
      n.addEventListener('pointermove', move); n.addEventListener('pointerup', up); n.addEventListener('pointercancel', cc);
    });
  });
  return api;
}

function keyDrop(ctx, host, cards, handle) {

  dnd({items: [chip], targets: cards, onDrop: async (it, card, from) => {
    if (it.disabled) return;

  }});

/* Une case qui devrait garder deux numéros : démonstration, puis retour en arrière. */
async function overflow(ctx, card, name, vals) {
  card.classList.add('nope');
  setTimeout(() => card.classList.remove('nope'), 500);
  const col = addCol(card, {n: name, k: 'fk'}, vals.map(v => v.map(nb).join('')), 1);

}

  {n: 6, t: 'Les contraintes', s: 'NOT NULL, UNIQUE, CHECK, ON DELETE'},
  {n: 7, t: 'Les transactions', s: 'BEGIN, COMMIT, ROLLBACK, SAVEPOINT'},
  {n: 8, t: 'Triggers et concurrence', s: 'Automatiser et isoler les écritures'},
  {n: 9, t: 'Vues et index', s: 'CREATE VIEW, index, EXPLAIN'},
  {n: 10, t: 'Les droits', s: 'Qui peut lire ou modifier quoi'},
];

/* Avancée : étape la plus loin atteinte et chapitres terminés (ce navigateur seulement). */
const KEY = 'requete-projet-ateliers-v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const prog = c => (store['c' + c.n] = store['c' + c.n] || {max: -1, done: false});

const app = document.getElementById('app');
const ctaBar = document.getElementById('cta-bar'), cta = document.getElementById('cta');
let token = 0;

function setHash(hsh) { try { history.replaceState(null, '', hsh ? '#' + hsh : location.pathname + location.search); } catch (e) {} }
function setCta(kind, label, fn) {
  ctaBar.hidden = false;
  cta.className = 'cta ' + kind;
  cta.disabled = kind === 'hint';
  cta.innerHTML = fr(label);
  cta.onclick = kind === 'hint' ? null : fn;
  if (kind !== 'hint') restart(cta, 'pop');
}
function reveal(el) {
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect(), limit = innerHeight - (ctaBar.hidden ? 20 : 104);
    if (r.bottom > limit) scrollBy({top: Math.min(r.bottom - limit, r.top - 80), behavior: RM ? 'auto' : 'smooth'});
  });
}
function topBar(back, label, mid) {
  const top = h('header', 'top');
  const inner = h('div', 'top-in');
  inner.append(back);
  if (mid) inner.append(mid); else if (label) inner.append(h('div', 'top-app', label));
  top.append(inner);
  return top;
}
function backBtn(icon, aria, fn, href) {
  const b = href ? document.createElement('a') : document.createElement('button');
  b.className = 'ibtn'; b.innerHTML = icon; b.setAttribute('aria-label', aria);
  if (href) b.href = href; else { b.type = 'button'; b.onclick = fn; }
  return b;
}

/* ---------- Accueil du module ---------- */
function renderHome() {
  token++; setHash(''); ctaBar.hidden = true; window.scrollTo(0, 0);
  app.innerHTML = '';
  app.append(topBar(backBtn(I_BACK, 'Revenir à Requête', null, '../../index.html'), 'Requête'));
  const w = h('main', 'wrap');
  const ready = CHAPTERS.filter(c => c.steps);
  const doneN = ready.filter(c => prog(c).done).length;
  const next = ready.find(c => !prog(c).done);
  w.append(h('span', 'pill', 'Module 8 · Projet'), h('h1', 'h1', 'La base des ateliers'),
    h('p', 'sub', 'Un seul cas suivi de bout en bout : de la modélisation à la sécurité, chaque chapitre ajoute une pièce.'));
  const hero = h('div', 'hero');
  const hc = next || ready[ready.length - 1];
  const p = prog(hc);
  hero.innerHTML = fr(`<div class="hero-row"><div><span class="hero-k">${next ? `Chapitre ${hc.n} sur ${CHAPTERS.length}` : 'Chapitres 1 et 2 terminés'}</span><b class="hero-t">${next ? hc.t : 'La suite arrive bientôt'}</b><span class="hero-s">${next ? hc.s : 'Tu peux revoir chaque chapitre à tout moment.'}</span></div><img class="hero-m" src="../anim/mascotte.webp" alt=""></div>` +
    `<div class="hero-bar" aria-hidden="true"><i style="width:${Math.round(doneN / CHAPTERS.length * 100)}%"></i></div>`);
  const go = h('button', 'hero-go', `<span class="pl">${I_PLAY}</span>${next ? (p.max >= 0 ? 'Reprendre le chapitre' : 'Commencer le chapitre') : 'Revoir le chapitre 2'}`);
  go.type = 'button'; go.onclick = () => renderCover(CHAPTERS.indexOf(hc));
  hero.append(go); w.append(hero);
  w.append(h('h2', 'sec', 'Les chapitres'));
  const list = h('div', 'ch-list');
  CHAPTERS.forEach((c, i) => {
    const pr = c.steps ? prog(c) : null;
    const state = !c.steps ? 'soon' : pr.done ? 'done' : c === next ? 'next' : '';
    const lbl = !c.steps ? 'Bientôt' : pr.done ? 'Terminé ✓' : pr.max >= 0 ? 'Reprendre' : 'Commencer';
    const row = h(c.steps ? 'button' : 'div', 'ch-row ' + state,
      `<span class="ch-num">${pr && pr.done ? '✓' : c.n}</span><span class="ch-txt"><span class="ch-t">${c.t}</span><span class="ch-s">${c.s}</span></span><span class="ch-st">${lbl}</span>`);
    if (c.steps) { row.type = 'button'; row.onclick = () => renderCover(i); row.setAttribute('aria-label', `Chapitre ${c.n} : ${c.t}. ${lbl}`); }
    list.append(row);
  });
  w.append(list);
  app.append(w);
}

/* ---------- Couverture d’un chapitre ---------- */
function renderCover(ci) {
  token++; const c = CHAPTERS[ci], p = prog(c);
  setHash('c' + c.n); window.scrollTo(0, 0);
  app.innerHTML = '';
  app.append(topBar(backBtn(I_BACK, 'Revenir aux chapitres', renderHome), 'Chapitres'));
  const w = h('main', 'wrap');
  const sec = h('section', 'step');
  sec.append(h('span', 'pill', `Chapitre ${c.n}`), h('h1', 'h1', c.t), h('p', 'sub', c.s));
  const card = h('div', 'cover-card', `<img class="cover-m" src="../anim/mascotte.webp" alt=""><div><span class="cover-k">🎯 Objectif</span><p class="cover-goal">${c.goal}</p></div>`);
  sec.append(card);
  const n = c.steps.filter(s => !s.end).length;
  sec.append(h('ul', 'cover-meta', `<li>${n} étapes interactives</li><li>Environ ${c.min} min</li><li>Au doigt ou à la souris</li>`));
  if (p.max >= 0) {
    const again = h('button', 'btn-3', 'Recommencer depuis le début'); again.type = 'button';
    again.onclick = () => { p.max = -1; p.done = false; save(); renderStep(ci, 0); };
    sec.append(again);
  }
  w.append(sec); app.append(w);
  const resume = p.max >= 0 && !p.done ? Math.min(p.max, c.steps.length - 1) : 0;
  setCta('go', p.done ? 'Revoir le chapitre' : p.max >= 0 ? 'Reprendre' : 'Commencer', () => renderStep(ci, resume));
}

/* ---------- Une étape ---------- */
function renderStep(ci, si) {
  const my = ++token, c = CHAPTERS[ci], S = c.steps[si], p = prog(c);
  p.max = Math.max(p.max, si); save();
  setHash(`c${c.n}/${si + 1}`); window.scrollTo(0, 0);
  app.innerHTML = '';
  const mid = h('div', 'top-mid');
  mid.append(h('div', 'top-lbl', `Chapitre ${c.n} · ${c.t}`));
  const bar = h('div', 'prog');
  c.steps.forEach((_, i) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = (i < si || S.end ? 'done' : i === si ? 'cur' : i <= p.max ? 'ahead' : '') + (i <= p.max && i !== si ? ' reach' : '');
    b.setAttribute('aria-label', `Étape ${i + 1} sur ${c.steps.length}` + (i === si ? ' (en cours)' : ''));
    if (i <= p.max && i !== si) b.onclick = () => renderStep(ci, i); else b.tabIndex = -1;
    bar.append(b);
  });
  mid.append(bar);
  app.append(topBar(backBtn(I_CLOSE, 'Quitter le chapitre', renderHome), null, mid));
  const w = h('main', 'wrap');
  const sec = h('section', 'step');
  w.append(sec); app.append(w);
  if (S.end) return renderEnd(ci, S, sec);
  sec.append(h('h2', 'step-title', S.title));
  if (S.lead) sec.append(h('p', 'lead', S.lead));
  const area = h('div', 'area');
  const fbHost = h('div', 'fb-host');
  sec.append(area, fbHost);
  const alive = () => my === token;
  const fb = (kind, html, title) => {
    if (!alive()) return;
    fbHost.innerHTML = '';
    const box = h('div', 'fb ' + kind, `<span class="fi" aria-hidden="true">${/err/.test(kind) ? '!' : '✓'}</span><div>${title ? `<b class="ft">${title}</b>` : ''}${html}</div>`);
    fbHost.append(box); reveal(box); say((title ? title + ' ' : '') + html);
  };
  const ctx = {
    area, alive, reveal,
    ok: (html, title) => fb('ok', html, title || 'Bonne réponse.'),
    err: (html, title) => { fb('err', html, title || 'Pas tout à fait.'); buzz(30); },
    mini: html => fb('ok mini', html),
    clear: () => { if (alive()) fbHost.innerHTML = ''; },
    lock: hint => { if (alive()) setCta('hint', hint); },
    unlock: (label, kind) => { if (alive()) setCta(kind || 'go', label || 'Continuer', () => goNext(ci, si, sec)); },
  };
  S.build(ctx);
}
async function goNext(ci, si, sec) {
  const my = token;
  cta.disabled = true;
  sec.classList.add('leave');
  await wait(170);
  if (my !== token) return;
  renderStep(ci, si + 1);
}

/* ---------- Fin de chapitre ---------- */
function renderEnd(ci, S, sec) {
  const c = CHAPTERS[ci], p = prog(c);
  p.done = true; save();
  sec.append(h('div', 'end-hero', `<img class="end-m" src="../anim/mascotte.webp" alt=""><div><span class="pill ok">Chapitre ${c.n} terminé</span><h2 class="end-t">${S.title}</h2><p class="end-s">${S.sub}</p></div>`));
  if (S.schema) sec.append(h('h3', 'sec', 'Le schéma des ateliers'), schemaChain());
  const rc = h('div', 'recap', '<h3 class="recap-h">Les trois idées à retenir</h3>');
  S.recap.forEach(([e, t]) => rc.append(h('div', 'rr', `<span class="re" aria-hidden="true">${e}</span><p>${t}</p>`)));
  sec.append(rc);
  const nextC = CHAPTERS[ci + 1];
  if (nextC && nextC.steps) {
    const back = h('button', 'btn-2', 'Revenir aux chapitres'); back.type = 'button'; back.onclick = renderHome;
    sec.append(back);
    setCta('ok', `Passer au chapitre ${nextC.n}`, () => renderCover(ci + 1));
  } else {
    setCta('ok', 'Revenir aux chapitres', renderHome);
  }
  buzz([10, 40, 10]);
  setTimeout(confetti, RM ? 0 : 250);
}

/* ---------- Démarrage : #c2/5 ouvre directement l’étape 5 du chapitre 2 ---------- */
function route() {
  const m = location.hash.match(/^#c(\d+)(?:\/(\d+))?$/);
  if (m) {
    const ci = CHAPTERS.findIndex(c => c.n === +m[1] && c.steps);
    if (ci >= 0) {
      if (m[2]) return renderStep(ci, Math.max(0, Math.min(+m[2] - 1, CHAPTERS[ci].steps.length - 1)));
      return renderCover(ci);
    }
  }
  renderHome();
}
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
